name: 定期スクリーニング

on:
  push:
    branches: [main]
  schedule:
    # 平日 08:00 UTC = 17:00 JST(東証 15:30 引け後)。日足確定後にデータ生成。
    - cron: "0 8 * * 1-5"
    # 米国市場の時間外取引終了後 (20:00 ET は翌日 00:00/01:00 UTC)。
    - cron: "20 1 * * 2-6"
  workflow_dispatch: {}  # 手動実行(任意のブランチを選択可)

# GitHub Actions で Pages を直接デプロイするために必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避ける(実行中のデプロイはキャンセルしない)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 条件評価と米国市場処理をテスト
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/gen_fixtures.py
          node tests/parity.mjs

      - name: スクリーニングデータ + チャートを生成
        run: python build_dataset.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 成果物(docs/)をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
