<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株スクリーニング</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2733; --sub: #66788a;
    --accent: #0a5cff; --accent-soft: #e8f0ff; --border: #dde3ea;
    --up: #d92b2b; --down: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --card: #1a2027; --text: #e8edf2; --sub: #93a4b5;
      --accent: #4d8dff; --accent-soft: #1d2c45; --border: #2c3540;
      --up: #ff6b6b; --down: #4cc38a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text); padding: 12px;
    padding-bottom: 40px; -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .sub { color: var(--sub); font-size: 0.8rem; margin-bottom: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 0.95rem; margin-bottom: 10px; }
  label.chk {
    display: inline-flex; align-items: center; gap: 6px;
    margin-right: 14px; font-size: 0.95rem; padding: 4px 0;
  }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .cond {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; margin-bottom: 8px; font-size: 0.9rem;
  }
  .cond-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cond-params { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--sub); }
  select, input[type=number], input[type=text], input[type=password], textarea {
    font-size: 16px; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text);
  }
  input[type=number] { width: 5.2em; }
  textarea { width: 100%; min-height: 60px; }
  button {
    font-size: 0.95rem; padding: 10px 14px; border: none; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  button.primary { background: var(--accent); color: #fff; width: 100%; font-size: 1.05rem; padding: 14px; }
  button.small { padding: 6px 10px; font-size: 0.8rem; }
  button.danger { background: transparent; color: var(--up); padding: 4px 8px; }
  button:disabled { opacity: 0.5; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--sub); font-weight: 600; position: sticky; top: 0; background: var(--card); cursor: pointer; }
  .table-wrap { overflow-x: auto; max-height: 62vh; overflow-y: auto; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .name { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 0.7rem; color: var(--sub); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
  .err { color: var(--up); font-size: 0.85rem; margin-top: 8px; }
  .ok { color: var(--down); font-size: 0.85rem; margin-top: 8px; }
  details summary { font-size: 0.9rem; color: var(--sub); padding: 6px 0; cursor: pointer; }
  tbody tr { cursor: pointer; }
  tbody tr:active { background: var(--accent-soft); }
  .chev { color: var(--sub); font-size: 0.75rem; }

  /* 詳細モーダル */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal[hidden] { display: none; }
  .sheet {
    background: var(--card); width: 100%; max-width: 640px;
    max-height: 92vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 16px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sheet-title { font-size: 1.1rem; font-weight: 700; }
  .sheet-code { color: var(--sub); font-size: 0.85rem; margin-top: 2px; }
  .sheet-close { background: var(--border); color: var(--text); border-radius: 999px;
    width: 34px; height: 34px; padding: 0; font-size: 1.1rem; flex: none; }
  .stat-grid { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0; }
  .stat { font-size: 0.9rem; }
  .stat b { display: block; font-size: 1.05rem; }
  .stat span.lbl { color: var(--sub); font-size: 0.72rem; }
  .period-btns { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .period-btns button { padding: 6px 12px; font-size: 0.85rem; background: var(--bg);
    color: var(--text); border: 1px solid var(--border); }
  .period-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chart-box { position: relative; margin-top: 6px; }
  .chart-box .yhi, .chart-box .ylo { position: absolute; right: 2px; font-size: 0.7rem;
    color: var(--sub); background: var(--card); padding: 0 2px; }
  .chart-box .yhi { top: 2px; } .chart-box .ylo { bottom: 30px; }
  svg.chart { width: 100%; height: 220px; display: block; }
  svg.chart .line { stroke-width: 2px; fill: none; }
  svg.chart.up .line { stroke: var(--up); } svg.chart.down .line { stroke: var(--down); }
  svg.chart .area { opacity: .12; }
  svg.chart.up .area { fill: var(--up); } svg.chart.down .area { fill: var(--down); }
  svg.chart .vol { fill: var(--sub); opacity: .35; }
  svg.chart .grid { stroke: var(--border); stroke-width: 1px; }
  .xlabels { display: flex; justify-content: space-between; color: var(--sub);
    font-size: 0.72rem; margin-top: 2px; }
  .detail-msg { color: var(--sub); font-size: 0.9rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<h1>📈 株スクリーニング</h1>
<div class="sub" id="meta">データ読み込み中...</div>

<div class="card">
  <h2>対象</h2>
  <label class="chk"><input type="checkbox" id="catStock" checked> 株</label>
  <label class="chk"><input type="checkbox" id="catTrust"> 信託(REIT等)</label>
  <label class="chk"><input type="checkbox" id="catEtf"> ETF</label>
  <label class="chk"><input type="checkbox" id="catCommodity"> 純金信託・商品</label>
</div>

<div class="card">
  <h2>条件(すべて AND)</h2>
  <div id="conds"></div>
  <div class="row">
    <button class="small" onclick="addCond('consecutive_monthly_gain')">＋連続上昇</button>
    <button class="small" onclick="addCond('rise_from_recent_low')">＋安値から上昇</button>
    <button class="small" onclick="addCond('period_return')">＋期間騰落率</button>
    <button class="small" onclick="addCond('price_range')">＋株価レンジ</button>
    <button class="small" onclick="addCond('min_avg_volume')">＋出来高</button>
  </div>
  <details style="margin-top:10px">
    <summary>🤖 自然言語で条件を指定(要 API キー)</summary>
    <textarea id="nlText" placeholder="例: 3ヶ月連続で10%以上上昇、株価は500円から3000円"></textarea>
    <div class="row"><button class="small" onclick="parseNL()" id="nlBtn">条件に変換</button></div>
    <div id="nlMsg"></div>
  </details>
</div>

<div class="card">
  <button class="primary" id="runBtn" onclick="runScreen()">スクリーニング実行</button>
  <div class="err" id="runErr"></div>
</div>

<div class="card" id="resultCard" hidden>
  <h2>結果 <span id="resultCount" class="sub"></span></h2>
  <div class="sub" style="margin:-4px 0 8px">行をタップで詳細・株価チャート</div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th onclick="sortBy('code')">コード</th><th>銘柄名</th>
        <th onclick="sortBy('close')">終値</th>
        <th onclick="sortBy('r3')">3ヶ月</th>
        <th onclick="sortBy('r1')">1ヶ月</th>
        <th onclick="sortBy('rw')">1週間</th>
      </tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<div class="card">
  <details>
    <summary>⚙️ 設定(Anthropic API キー)</summary>
    <p class="sub" style="margin:8px 0">自然言語変換に使用します。キーはこの端末のブラウザ(localStorage)にのみ保存され、変換時に直接 Anthropic API へ送信されます。使わない場合は不要です。</p>
    <div class="row">
      <input type="password" id="apiKey" placeholder="sk-ant-..." style="flex:1">
      <button class="small" onclick="saveKey()">保存</button>
    </div>
    <div id="keyMsg"></div>
  </details>
</div>

<div class="modal" id="detailModal" hidden onclick="if(event.target===this)closeDetail()">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="dTitle"></div>
        <div class="sheet-code" id="dCode"></div>
      </div>
      <button class="sheet-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="stat-grid" id="dStats"></div>
    <div class="period-btns" id="dPeriods"></div>
    <div id="dChart"><div class="detail-msg">読み込み中...</div></div>
  </div>
</div>

<script src="conditions.js"></script>
<script>
const CATS = { stock: '株', trust: '信託', etf: 'ETF', commodity: '商品' };
let DATA = null;
const CONDS = [];
let RESULTS = [];
let sortKey = 'r3', sortDesc = true;

const DEFS = {
  consecutive_monthly_gain: { label: '連続月間上昇', make: () => ({type:'consecutive_monthly_gain', months:3, min_pct:10}) },
  rise_from_recent_low:     { label: '安値からの上昇', make: () => ({type:'rise_from_recent_low', lookback_months:3, min_pct:10}) },
  period_return:            { label: '期間騰落率', make: () => ({type:'period_return', period:'3m', op:'>=', pct:10}) },
  price_range:              { label: '株価レンジ', make: () => ({type:'price_range', min:100, max:10000}) },
  min_avg_volume:           { label: '平均出来高', make: () => ({type:'min_avg_volume', days:20, min_volume:100000}) },
};

function addCond(type, preset) { CONDS.push(preset || DEFS[type].make()); renderConds(); }
function delCond(i) { CONDS.splice(i, 1); renderConds(); }

function num(c, key, opts) {
  return `<input type="number" ${opts||''} value="${c[key] ?? ''}"
    onchange="CONDS[${c._i}].${key} = this.value === '' ? null : Number(this.value)">`;
}

function renderConds() {
  const el = document.getElementById('conds');
  el.innerHTML = '';
  CONDS.forEach((c, i) => {
    c._i = i;
    let body = '';
    if (c.type === 'consecutive_monthly_gain')
      body = `${num(c,'months','min=1 max=12')} ヶ月連続で、毎月 ${num(c,'min_pct')} % 以上上昇`;
    else if (c.type === 'rise_from_recent_low')
      body = `直近 ${num(c,'lookback_months','min=1 max=12')} ヶ月の安値から ${num(c,'min_pct')} % 以上上昇`;
    else if (c.type === 'period_return')
      body = `<select onchange="CONDS[${i}].period=this.value">
          <option value="3m" ${c.period==='3m'?'selected':''}>3ヶ月</option>
          <option value="1m" ${c.period==='1m'?'selected':''}>1ヶ月</option>
          <option value="1w" ${c.period==='1w'?'selected':''}>1週間</option>
        </select> の騰落率が ${num(c,'pct')} %
        <select onchange="CONDS[${i}].op=this.value">
          <option value=">=" ${c.op==='>='?'selected':''}>以上</option>
          <option value="<=" ${c.op==='<='?'selected':''}>以下</option>
        </select>`;
    else if (c.type === 'price_range')
      body = `終値が ${num(c,'min')} 円 〜 ${num(c,'max')} 円`;
    else if (c.type === 'min_avg_volume')
      body = `直近 <select onchange="CONDS[${i}].days=Number(this.value)">
          ${[5,20,60].map(d=>`<option value="${d}" ${c.days===d?'selected':''}>${d}</option>`).join('')}
        </select> 日の平均出来高が ${num(c,'min_volume')} 以上`;
    el.insertAdjacentHTML('beforeend', `
      <div class="cond">
        <div class="cond-head">
          <strong>${DEFS[c.type]?.label || c.type}</strong>
          <button class="danger" onclick="delCond(${i})">削除</button>
        </div>
        <div class="cond-params">${body}</div>
      </div>`);
  });
}

function selectedCats() {
  const cats = [];
  if (document.getElementById('catStock').checked) cats.push('stock');
  if (document.getElementById('catTrust').checked) cats.push('trust');
  if (document.getElementById('catEtf').checked) cats.push('etf');
  if (document.getElementById('catCommodity').checked) cats.push('commodity');
  return cats;
}

function runScreen() {
  const errEl = document.getElementById('runErr');
  errEl.textContent = '';
  if (!DATA) { errEl.textContent = 'データが読み込まれていません'; return; }
  const conds = CONDS.map(({_i, ...c}) => c);
  if (conds.length === 0) { errEl.textContent = '条件を1つ以上追加してください'; return; }
  const cats = selectedCats();
  if (cats.length === 0) { errEl.textContent = '対象を選択してください'; return; }

  RESULTS = DATA.stocks.filter(
    (s) => cats.includes(s.cat) && ScreenConditions.evaluateConditions(s, conds)
  );
  renderResults();
}

function fmtPct(v) {
  if (v === null || v === undefined) return '-';
  const cls = v >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}

function sortBy(key) {
  sortDesc = (sortKey === key) ? !sortDesc : true;
  sortKey = key;
  renderResults();
}

function renderResults() {
  const rows = [...RESULTS].sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === 'code') { x = a.code; y = b.code; return sortDesc ? y.localeCompare(x) : x.localeCompare(y); }
    x = x ?? -1e9; y = y ?? -1e9;
    return sortDesc ? y - x : x - y;
  });
  document.getElementById('resultCard').hidden = false;
  document.getElementById('resultCount').textContent = `${rows.length} 銘柄`;
  document.getElementById('resultBody').innerHTML = rows.map(r => `
    <tr onclick="openDetail('${r.code}')">
      <td>${r.code} <span class="tag">${CATS[r.cat]||r.cat}</span></td>
      <td class="name">${r.name} <span class="chev">›</span></td>
      <td>${r.close != null ? r.close.toLocaleString() : '-'}</td>
      <td>${fmtPct(r.r3)}</td>
      <td>${fmtPct(r.r1)}</td>
      <td>${fmtPct(r.rw)}</td>
    </tr>`).join('');
}

// ---- 銘柄詳細 + 株価チャート ----
const CHART_CACHE = {};
const PERIODS = [
  { label: '1週', n: 5 }, { label: '1ヶ月', n: 21 }, { label: '3ヶ月', n: 63 },
  { label: '6ヶ月', n: 126 }, { label: '1年', n: 9999 },
];
let curChart = null, curStock = null, curPeriod = 2;

function openDetail(code) {
  curStock = RESULTS.find(s => s.code === code) || (DATA && DATA.stocks.find(s => s.code === code));
  if (!curStock) return;
  const m = document.getElementById('detailModal');
  m.hidden = false;
  document.getElementById('dTitle').textContent = curStock.name;
  document.getElementById('dCode').textContent = `${curStock.code}・${CATS[curStock.cat] || curStock.cat}`;
  document.getElementById('dStats').innerHTML = [
    ['終値', curStock.close != null ? curStock.close.toLocaleString() + ' 円' : '-'],
    ['3ヶ月', fmtPct(curStock.r3)], ['1ヶ月', fmtPct(curStock.r1)], ['1週間', fmtPct(curStock.rw)],
  ].map(([l, v]) => `<div class="stat"><span class="lbl">${l}</span><b>${v}</b></div>`).join('');
  document.getElementById('dPeriods').innerHTML = PERIODS.map((p, i) =>
    `<button class="${i === curPeriod ? 'active' : ''}" onclick="setPeriod(${i})">${p.label}</button>`).join('');
  document.getElementById('dChart').innerHTML = '<div class="detail-msg">読み込み中...</div>';
  curChart = null;
  loadChart(code);
}

function closeDetail() { document.getElementById('detailModal').hidden = true; }

async function loadChart(code) {
  if (CHART_CACHE[code]) { curChart = CHART_CACHE[code]; renderChart(); return; }
  try {
    const res = await fetch(`./data/charts/${code}.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    CHART_CACHE[code] = data;
    if (curStock && curStock.code === code) { curChart = data; renderChart(); }
  } catch (e) {
    document.getElementById('dChart').innerHTML =
      '<div class="detail-msg">チャートデータを取得できませんでした</div>';
  }
}

function setPeriod(i) {
  curPeriod = i;
  document.querySelectorAll('#dPeriods button').forEach((b, j) =>
    b.classList.toggle('active', j === i));
  renderChart();
}

function renderChart() {
  if (!curChart) return;
  const n = curChart.close.length;
  const count = Math.min(PERIODS[curPeriod].n, n);
  const start = n - count;
  const close = curChart.close.slice(start);
  const vol = curChart.vol.slice(start);
  const dates = curChart.d.slice(start);
  document.getElementById('dChart').innerHTML = buildChartHTML(dates, close, vol);
}

function buildChartHTML(dates, close, vol) {
  if (close.length < 2) return '<div class="detail-msg">データが不足しています</div>';
  const W = 320, H = 200, padT = 6, padB = 34, padX = 2;
  const n = close.length;
  const lo = Math.min(...close), hi = Math.max(...close), span = (hi - lo) || 1;
  const x = i => padX + (W - 2 * padX) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - lo) / span);
  const linePts = close.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const areaPts = `${x(0).toFixed(1)},${(H - padB).toFixed(1)} ${linePts} ${x(n - 1).toFixed(1)},${(H - padB).toFixed(1)}`;
  const vmax = Math.max(...vol, 1), bandH = padB - 8, bandTop = H - padB + 6;
  const bw = Math.max(0.6, (W - 2 * padX) / n * 0.7);
  const bars = vol.map((v, i) =>
    `<rect class="vol" x="${(x(i) - bw / 2).toFixed(1)}" y="${(bandTop + bandH * (1 - v / vmax)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(bandH * v / vmax).toFixed(1)}"/>`
  ).join('');
  const up = close[n - 1] >= close[0];
  const svg = `<svg class="chart ${up ? 'up' : 'down'}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="grid" x1="0" y1="${padT.toFixed(1)}" x2="${W}" y2="${padT.toFixed(1)}"/>
    <line class="grid" x1="0" y1="${(H - padB).toFixed(1)}" x2="${W}" y2="${(H - padB).toFixed(1)}"/>
    ${bars}
    <polygon class="area" points="${areaPts}"/>
    <polyline class="line" points="${linePts}" vector-effect="non-scaling-stroke"/>
  </svg>`;
  const chg = ((close[n - 1] / close[0] - 1) * 100);
  return `<div class="chart-box">
      <span class="yhi">${hi.toLocaleString()}</span>
      <span class="ylo">${lo.toLocaleString()}</span>
      ${svg}
    </div>
    <div class="xlabels"><span>${dates[0]}</span>
      <span class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%</span>
      <span>${dates[n - 1]}</span></div>`;
}

// ---- 自然言語 → 条件(Anthropic API 直接呼び出し / model-routing: haiku) ----
const NL_SCHEMA = {
  type: "object",
  properties: { conditions: { type: "array", items: {
    type: "object",
    properties: {
      type: { type: "string", enum: ["consecutive_monthly_gain","rise_from_recent_low","period_return","price_range","min_avg_volume"] },
      months: { type: ["integer","null"] }, min_pct: { type: ["number","null"] },
      lookback_months: { type: ["integer","null"] },
      period: { type: ["string","null"], enum: ["3m","1m","1w",null] },
      op: { type: ["string","null"], enum: [">=","<=",null] }, pct: { type: ["number","null"] },
      min: { type: ["number","null"] }, max: { type: ["number","null"] },
      days: { type: ["integer","null"], enum: [5,20,60,null] }, min_volume: { type: ["number","null"] },
    },
    required: ["type"], additionalProperties: false,
  } } },
  required: ["conditions"], additionalProperties: false,
};
const NL_SYSTEM = `あなたは株式スクリーニング条件のパーサーです。日本語の条件文を指定スキーマの JSON 条件リストに変換してください。
条件タイプ: consecutive_monthly_gain(N ヶ月連続で毎月 min_pct% 以上上昇: months,min_pct)/ rise_from_recent_low(直近 lookback_months ヶ月の安値から min_pct% 以上上昇)/ period_return(期間 period[3m/1m/1w] の騰落率が op[>=/<=] pct%)/ price_range(株価 min〜max 円)/ min_avg_volume(直近 days[5/20/60] 日の平均出来高が min_volume 以上)。
使わないフィールドは null。解釈できない要素は無視し、確実に読み取れた条件のみ出力。`;

async function parseNL() {
  const msg = document.getElementById('nlMsg');
  const btn = document.getElementById('nlBtn');
  const text = document.getElementById('nlText').value.trim();
  if (!text) return;
  const key = localStorage.getItem('anthropic_api_key');
  if (!key) { msg.className='err'; msg.textContent='先に設定から API キーを保存してください'; return; }
  msg.className=''; msg.textContent='変換中...'; btn.disabled = true;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5', max_tokens: 1024, system: NL_SYSTEM,
        output_config: { format: { type: 'json_schema', schema: NL_SCHEMA } },
        messages: [{ role: 'user', content: text }],
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.statusText);
    const raw = data.content.find(b => b.type === 'text').text;
    const conds = (JSON.parse(raw).conditions || [])
      .map(c => Object.fromEntries(Object.entries(c).filter(([, v]) => v !== null)));
    if (conds.length === 0) throw new Error('条件を読み取れませんでした');
    conds.forEach(c => CONDS.push(c));
    renderConds();
    msg.className='ok'; msg.textContent = `${conds.length} 件の条件を追加しました`;
  } catch (e) {
    msg.className='err'; msg.textContent = '変換失敗: ' + e.message;
  } finally { btn.disabled = false; }
}

function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  const msg = document.getElementById('keyMsg');
  if (!key) return;
  localStorage.setItem('anthropic_api_key', key);
  document.getElementById('apiKey').value = '';
  msg.className='ok'; msg.textContent = '保存しました(この端末のみ)';
}

// ---- 初期化 ----
(async () => {
  const metaEl = document.getElementById('meta');
  try {
    const res = await fetch('./data/screening.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    const c = DATA.counts || {};
    const parts = Object.keys(CATS).filter(k => c[k]).map(k => `${CATS[k]} ${c[k]}`);
    metaEl.innerHTML = `基準日: <b>${DATA.base_date}</b>(${DATA.total} 銘柄 / ${parts.join(' ・ ')})<br>更新: ${DATA.generated_at || '-'}`;
  } catch (e) {
    metaEl.className = 'err';
    metaEl.textContent = 'データ未生成です。GitHub Actions の「定期スクリーニング」を実行してください。';
  }
  addCond('consecutive_monthly_gain');
})();
</script>
