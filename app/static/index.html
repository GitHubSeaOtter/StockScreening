<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株スクリーニング</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2733; --sub: #66788a;
    --accent: #0a5cff; --accent-soft: #e8f0ff; --border: #dde3ea;
    --up: #d92b2b; --down: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --card: #1a2027; --text: #e8edf2; --sub: #93a4b5;
      --accent: #4d8dff; --accent-soft: #1d2c45; --border: #2c3540;
      --up: #ff6b6b; --down: #4cc38a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text); padding: 12px;
    padding-bottom: 40px; -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .sub { color: var(--sub); font-size: 0.8rem; margin-bottom: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 0.95rem; margin-bottom: 10px; }
  label.chk {
    display: inline-flex; align-items: center; gap: 6px;
    margin-right: 14px; font-size: 0.95rem; padding: 4px 0;
  }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .cond {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; margin-bottom: 8px; font-size: 0.9rem;
  }
  .cond-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cond-params { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--sub); }
  select, input[type=number], input[type=text], input[type=password], textarea {
    font-size: 16px; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text);
  }
  input[type=number] { width: 5.2em; }
  textarea { width: 100%; min-height: 60px; }
  button {
    font-size: 0.95rem; padding: 10px 14px; border: none; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  button.primary { background: var(--accent); color: #fff; width: 100%; font-size: 1.05rem; padding: 14px; }
  button.small { padding: 6px 10px; font-size: 0.8rem; }
  button.danger { background: transparent; color: var(--up); padding: 4px 8px; }
  button:disabled { opacity: 0.5; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .progress { margin-top: 10px; font-size: 0.9rem; color: var(--sub); }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--sub); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  .table-wrap { overflow-x: auto; max-height: 60vh; overflow-y: auto; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  .name { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
  .err { color: var(--up); font-size: 0.85rem; margin-top: 8px; }
  .ok { color: var(--down); font-size: 0.85rem; margin-top: 8px; }
  details summary { font-size: 0.9rem; color: var(--sub); padding: 6px 0; }
</style>
</head>
<body>
<h1>📈 株スクリーニング</h1>
<div class="sub">基準日: <span id="baseDate">読み込み中...</span>(東証上場銘柄)</div>

<div class="card">
  <h2>対象</h2>
  <label class="chk"><input type="checkbox" id="catStock" checked> 株</label>
  <label class="chk"><input type="checkbox" id="catTrust"> 信託(REIT等)</label>
  <label class="chk"><input type="checkbox" id="catEtf"> ETF</label>
</div>

<div class="card">
  <h2>条件(すべて AND)</h2>
  <div id="conds"></div>
  <div class="row">
    <button class="small" onclick="addCond('consecutive_monthly_gain')">＋連続上昇</button>
    <button class="small" onclick="addCond('rise_from_recent_low')">＋安値から上昇</button>
    <button class="small" onclick="addCond('period_return')">＋期間騰落率</button>
    <button class="small" onclick="addCond('price_range')">＋株価レンジ</button>
    <button class="small" onclick="addCond('min_avg_volume')">＋出来高</button>
  </div>
  <details style="margin-top:10px">
    <summary>🤖 自然言語で条件を指定(要 API キー)</summary>
    <textarea id="nlText" placeholder="例: 3ヶ月連続で10%以上上昇、株価は500円から3000円"></textarea>
    <div class="row">
      <button class="small" onclick="parseNL()" id="nlBtn">条件に変換</button>
    </div>
    <div id="nlMsg"></div>
  </details>
</div>

<div class="card">
  <button class="primary" id="runBtn" onclick="runScreen()">スクリーニング実行</button>
  <div class="progress" id="progress" hidden>
    <span id="progText"></span>
    <div class="bar"><div id="progBar"></div></div>
  </div>
  <div class="err" id="runErr"></div>
</div>

<div class="card" id="resultCard" hidden>
  <h2>結果 <span id="resultCount" class="sub"></span></h2>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>コード</th><th>銘柄名</th><th>終値</th>
        <th onclick="sortBy('return_3m')">3ヶ月↕</th>
        <th onclick="sortBy('return_1m')">1ヶ月↕</th>
        <th onclick="sortBy('return_1w')">1週間↕</th>
      </tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<div class="card">
  <details>
    <summary>⚙️ 設定(Anthropic API キー)</summary>
    <p class="sub" style="margin:8px 0">キーはサーバーのローカル(config/settings.json)にのみ保存されます。自然言語変換機能を使わない場合は不要です。</p>
    <div class="row">
      <input type="password" id="apiKey" placeholder="sk-ant-..." style="flex:1">
      <button class="small" onclick="saveKey()">保存</button>
    </div>
    <div id="keyMsg"></div>
  </details>
</div>

<script>
const CONDS = [];
let RESULTS = [];
let sortKey = 'return_3m', sortDesc = true;

const DEFS = {
  consecutive_monthly_gain: { label: '連続月間上昇', make: () => ({type:'consecutive_monthly_gain', months:3, min_pct:10}) },
  rise_from_recent_low:     { label: '安値からの上昇', make: () => ({type:'rise_from_recent_low', lookback_months:3, min_pct:10}) },
  period_return:            { label: '期間騰落率', make: () => ({type:'period_return', period:'3m', op:'>=', pct:10}) },
  price_range:              { label: '株価レンジ', make: () => ({type:'price_range', min:100, max:10000}) },
  min_avg_volume:           { label: '平均出来高', make: () => ({type:'min_avg_volume', days:20, min_volume:100000}) },
};

function addCond(type, preset) {
  CONDS.push(preset || DEFS[type].make());
  renderConds();
}
function delCond(i) { CONDS.splice(i, 1); renderConds(); }

function num(c, key, opts) {
  return `<input type="number" ${opts||''} value="${c[key] ?? ''}"
    onchange="CONDS[${c._i}].${key} = this.value === '' ? null : Number(this.value)">`;
}

function renderConds() {
  const el = document.getElementById('conds');
  el.innerHTML = '';
  CONDS.forEach((c, i) => {
    c._i = i;
    let body = '';
    if (c.type === 'consecutive_monthly_gain')
      body = `${num(c,'months','min=1 max=12')} ヶ月連続で、毎月 ${num(c,'min_pct')} % 以上上昇`;
    else if (c.type === 'rise_from_recent_low')
      body = `直近 ${num(c,'lookback_months','min=1 max=12')} ヶ月の安値から ${num(c,'min_pct')} % 以上上昇`;
    else if (c.type === 'period_return')
      body = `<select onchange="CONDS[${i}].period=this.value">
          <option value="3m" ${c.period==='3m'?'selected':''}>3ヶ月</option>
          <option value="1m" ${c.period==='1m'?'selected':''}>1ヶ月</option>
          <option value="1w" ${c.period==='1w'?'selected':''}>1週間</option>
        </select> の騰落率が ${num(c,'pct')} %
        <select onchange="CONDS[${i}].op=this.value">
          <option value=">=" ${c.op==='>='?'selected':''}>以上</option>
          <option value="<=" ${c.op==='<='?'selected':''}>以下</option>
        </select>`;
    else if (c.type === 'price_range')
      body = `終値が ${num(c,'min')} 円 〜 ${num(c,'max')} 円`;
    else if (c.type === 'min_avg_volume')
      body = `直近 ${num(c,'days')} 日の平均出来高が ${num(c,'min_volume')} 以上`;
    el.insertAdjacentHTML('beforeend', `
      <div class="cond">
        <div class="cond-head">
          <strong>${DEFS[c.type]?.label || c.type}</strong>
          <button class="danger" onclick="delCond(${i})">削除</button>
        </div>
        <div class="cond-params">${body}</div>
      </div>`);
  });
}

function categories() {
  const cats = [];
  if (document.getElementById('catStock').checked) cats.push('stock');
  if (document.getElementById('catTrust').checked) cats.push('trust');
  if (document.getElementById('catEtf').checked) cats.push('etf');
  return cats;
}

async function runScreen() {
  const errEl = document.getElementById('runErr');
  errEl.textContent = '';
  const conds = CONDS.map(({_i, ...c}) => c);
  if (conds.length === 0) { errEl.textContent = '条件を1つ以上追加してください'; return; }
  if (categories().length === 0) { errEl.textContent = '対象を選択してください'; return; }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('progress').hidden = false;
  document.getElementById('progText').textContent = '銘柄リスト取得中...';

  try {
    const res = await fetch('/api/screen', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ categories: categories(), conditions: conds }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const { job_id } = await res.json();
    await pollJob(job_id);
  } catch (e) {
    errEl.textContent = 'エラー: ' + e.message;
  } finally {
    btn.disabled = false;
    document.getElementById('progress').hidden = true;
  }
}

async function pollJob(jobId) {
  while (true) {
    await new Promise(r => setTimeout(r, 1500));
    const res = await fetch('/api/screen/' + jobId);
    const job = await res.json();
    if (job.status === 'running') {
      const { progress, total } = job;
      document.getElementById('progText').textContent =
        total ? `株価取得中... ${progress} / ${total} 銘柄` : '準備中...';
      document.getElementById('progBar').style.width =
        total ? (100 * progress / total) + '%' : '0%';
    } else if (job.status === 'done') {
      RESULTS = job.results;
      renderResults();
      return;
    } else {
      throw new Error(job.error || '不明なエラー');
    }
  }
}

function fmtPct(v) {
  if (v === null || v === undefined) return '-';
  const cls = v >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}

function sortBy(key) {
  sortDesc = (sortKey === key) ? !sortDesc : true;
  sortKey = key;
  renderResults();
}

function renderResults() {
  const rows = [...RESULTS].sort((a, b) => {
    const x = a[sortKey] ?? -1e9, y = b[sortKey] ?? -1e9;
    return sortDesc ? y - x : x - y;
  });
  document.getElementById('resultCard').hidden = false;
  document.getElementById('resultCount').textContent = `${rows.length} 銘柄`;
  document.getElementById('resultBody').innerHTML = rows.map(r => `
    <tr>
      <td>${r.code}</td>
      <td class="name">${r.name}</td>
      <td>${r.close.toLocaleString()}</td>
      <td>${fmtPct(r.return_3m)}</td>
      <td>${fmtPct(r.return_1m)}</td>
      <td>${fmtPct(r.return_1w)}</td>
    </tr>`).join('');
}

async function parseNL() {
  const msg = document.getElementById('nlMsg');
  const btn = document.getElementById('nlBtn');
  const text = document.getElementById('nlText').value.trim();
  if (!text) return;
  msg.className = ''; msg.textContent = '変換中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/parse_condition', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (data.conditions.length === 0) throw new Error('条件を読み取れませんでした');
    data.conditions.forEach(c => CONDS.push(c));
    renderConds();
    msg.className = 'ok';
    msg.textContent = `${data.conditions.length} 件の条件を追加しました`;
  } catch (e) {
    msg.className = 'err';
    msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

async function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  const msg = document.getElementById('keyMsg');
  if (!key) return;
  const res = await fetch('/api/settings', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ api_key: key }),
  });
  msg.className = res.ok ? 'ok' : 'err';
  msg.textContent = res.ok ? '保存しました' : '保存に失敗しました';
  document.getElementById('apiKey').value = '';
}

// 初期化
(async () => {
  try {
    const res = await fetch('/api/base_date');
    document.getElementById('baseDate').textContent = (await res.json()).base_date;
  } catch { document.getElementById('baseDate').textContent = '取得失敗'; }
  addCond('consecutive_monthly_gain');
})();
</script>
</body>
</html>
